<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRAP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         GAME CONTAINER
    ========================== -->

    <main id="game">

        <!-- Game title -->
        <header id="header">
            <h1>CRAP</h1>
            <p>Choices, Ratings, Anecdotes & Priorities</p>
        </header>


        <!-- =========================
             LOBBY
        ========================== -->

        <section id="lobby" class="screen">

            <h2>Set Up Game</h2>

            <!-- Player count -->
            <div id="player-count-section">

                <label for="player-count">
                    Number of Players
                </label>

                <select id="player-count">
                    <option value="2">2 Players</option>
                    <option value="3" selected>3 Players</option>
                    <option value="4">4 Players</option>
                    <option value="5">5 Players</option>
                    <option value="6">6 Players</option>
                    <option value="7">7 Players</option>
                    <option value="8">8 Players</option>
                </select>

            </div>

            <div id="round-count-section">

                <label for="round-count">
                    Number of Rounds
                </label>

                <select id="round-count">

                    <option value="3">3 Rounds</option>
                    <option value="5">5 Rounds</option>
                    <option value="10" selected>10 Rounds</option>
                    <option value="15">15 Rounds</option>
                    <option value="20">20 Rounds</option>

                </select>

            </div>

            <!-- Player names -->
            <div id="player-names-section">

                <h3>Player Names</h3>

                <div id="player-names">
                    <!-- Inputs generated by JavaScript -->
                </div>

            </div>

            <button id="start-game">
                Start Game
            </button>

            <button id="continue-game" class="hidden">Continue Game</button>

        </section>


        <!-- =========================
             ROUND
        ========================== -->

        <section id="round" class="screen hidden">

            <div id="category-selection" class="hidden">

                <div id="category-selection-label">
                    CATEGORY
                </div>

                <div id="category-spinner">
                    CHOICES
                </div>

            </div>

            
            <div id="round-info">
                <span id="round-number"></span>
            </div>

            <h2 id="judge">
                Judge: Player
            </h2>

            <div id="prompt">
                <!-- Question goes here -->
            </div>


            <!-- =========================
                 ANSWER AREA
            ========================== -->

            <div id="answer-area">

                <!-- Text answer -->
                <div id="text-answer" class="answer-type hidden">

                    <input
                        id="answer-input"
                        type="text"
                        placeholder="Enter your answer..."
                        maxlength="100"
                    >

                    <button id="submit-answer">
                        Submit Answer
                    </button>

                </div>


                <!-- Rating answer -->
                <div id="rating-answer" class="answer-type hidden">

                    <div id="rating-buttons"></div>

                    <button id="submit-rating">
                        Submit Rating
                    </button>

                </div>


                <!-- Priority answer -->
                <div id="priority-answer" class="answer-type hidden">

                    <div id="priority-options"></div>

                    <button id="submit-priority">
                        Submit Priority
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             JUDGE SCREEN
        ========================== -->

        <section id="judge-screen" class="screen hidden">

            <h2>You are the Judge</h2>

            <div id="judge-prompt"></div>

            <div id="judge-answers">
                <!-- Submitted answers appear here -->
            </div>

            <button id="judge-submit">
                Choose
            </button>

        </section>


        <!-- =========================
             RESULTS
        ========================== -->

        <section id="results" class="screen hidden">

            <h2>Results</h2>

            <div id="results-content">
                <!-- Results generated by JS -->
            </div>

            <button id="next-round">
                Next Round
            </button>

        </section>


        <!-- =========================
             SCOREBOARD
        ========================== -->

        <section id="scoreboard" class="screen hidden">

            <h2>Scoreboard</h2>

            <div id="scores">
                <!-- Scores generated by JS -->
            </div>

            <button id="return-to-menu">
                Return to Menu
            </button>

        </section>

    </main>

    <script src="choices.js"></script>
    <script src="ratings.js"></script>
    <script src="anecdotes.js"></script>
    <script src="priorities.js"></script>
    <script src="game.js"></script>

</body>
</html>
